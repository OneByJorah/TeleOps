[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teleops"
version = "1.0.0"
description = "A unified NOC platform for Telegram — monitor agents, discover SNMP devices, run a live dashboard, and manage Linux and Windows hosts from chat commands."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OneByJorah", email = "info@jorahone.com"}]
keywords = ["telegram", "noc", "monitoring", "snmp", "network-operations", "flask", "socketio", "dashboard", "chatops", "self-hosted", "linux", "windows", "jorahone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.0",
    "eventlet>=0.34",
    "requests>=2.31",
    "python-telegram-bot>=20.0",
    "pysnmp>=4.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/OneByJorah/TeleOps"
Repository = "https://github.com/OneByJorah/TeleOps"
Issues = "https://github.com/OneByJorah/TeleOps/issues"

[tool.setuptools.packages.find]
include = ["teleops*"]
