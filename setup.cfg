[flake8]
max-line-length = 120
# E501/W503: long lines + line-break-before-operator are accepted here.
# E221: the codebase deliberately aligns assignment/dict values for readability
#       (73 of the original 181 findings). Excluded on purpose.
# This file only works because the workflow no longer passes --ignore, which
# REPLACES flake8's built-in defaults (E24 among them) instead of adding to them.
extend-ignore = E501,W503,E221
